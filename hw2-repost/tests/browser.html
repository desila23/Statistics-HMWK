<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browser verification — ECC × Caesar</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="shell"><section class="section"><span class="eyebrow">DEVELOPMENT / VERIFICATION</span><h1>Browser checks</h1><p>Tests run against the shipped JavaScript modules. Crypto checks require HTTPS or localhost. An insecure preview can still check public-point search and statistical workers.</p><button class="btn primary" id="run">Run browser checks</button><pre class="output" id="out" role="status">Ready.</pre><a href="../">Return to the laboratory</a></section></main><script type="module">
import {caesar,decipher,publicKey,encrypt,decrypt,modelFrom,body,experiment} from '../js/core.js';
const out=document.getElementById('out'),run=document.getElementById('run');
const log=t=>out.textContent+=t+'\n';let passed=0;function check(ok,text){if(!ok)throw Error(text);passed++;log('PASS '+text);}
function workerTask(data){return new Promise((resolve,reject)=>{const worker=new Worker('../js/worker.js',{type:'module'});let progress=0;worker.onmessage=e=>{if(e.data.type==='progress')progress++;else{worker.terminate();if(e.data.type==='error')reject(Error(e.data.message));else resolve({...e.data,updates:progress});}};worker.onerror=e=>{worker.terminate();reject(Error(e.message));};worker.postMessage(data);});}
run.onclick=async()=>{run.disabled=true;out.textContent='';passed=0;try{for(let k=0;k<26;k++)check(decipher(caesar('Hello, World! Zz é 👋',k),k)==='Hello, World! Zz é 👋','Caesar shift '+k);const found=await workerTask({type:'attack',Q:publicKey(1379),max:4096,paced:false});check(found.key===1379&&found.tested===1379,'ECC worker recovers d=1379 from Q alone');check(found.updates>1,'ECC worker emits progress updates');const absent=await workerTask({type:'attack',Q:publicKey(17),max:16,paced:false});check(absent.key===null&&absent.tested===16,'Out-of-range key is not found');const [train,test]=await Promise.all(['../data/pg1342.txt','../data/pg1661.txt'].map(p=>fetch(p).then(r=>r.text())));const result=await workerTask({type:'statistics',train,test,trials:200,seed:20261021});const expected=await fetch('../results/reference.json').then(r=>r.json());check(JSON.stringify(result.result.rows)===JSON.stringify(expected.rows),'Statistical worker exactly matches reference rows');let maxDifference=0;check(result.result.raw.length===expected.raw.length,'Raw trial count matches reference');for(let i=0;i<expected.raw.length;i++){const got=result.result.raw[i],ref=expected.raw[i];for(const field of ['length','trial','start','actual','chiKey','bigramKey'])if(got[field]!==ref[field])throw Error('Raw trial mismatch '+i+' '+field);for(const field of ['chiScore','bigramScore']){const difference=Math.abs(got[field]-ref[field]);maxDifference=Math.max(maxDifference,difference);if(difference>1e-10*Math.max(1,Math.abs(ref[field])))throw Error('Score mismatch '+i+' '+field);}}check(true,'All trial inputs and recovered keys match exactly; floating-point scores match within tolerance');log('Maximum absolute browser/Node score difference: '+maxDifference);if(crypto.subtle){const sealed=await encrypt('Browser UTF-8 round-trip: caffè 👋',1379),opened=await decrypt(sealed.packet,1379);check(opened.message==='Browser UTF-8 round-trip: caffè 👋','Browser encryption/decryption');let rejected=false;try{await decrypt(sealed.packet,1);}catch{rejected=true;}check(rejected,'Browser rejects wrong private key');}else log('SKIP Browser ECDH/HKDF/AES-GCM round-trip: insecure HTTP preview has no crypto.subtle. Node tests cover the same shipped code.');log(`DONE: ${passed} checks passed.`);}catch(e){log('FAIL '+e.message);}finally{run.disabled=false;}};
</script></body></html>
